# Runs every check on every push: the secrets scan first, then `npm run check`.
name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Check out the code with its full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $archive\$" | sha256sum --check
          tar -xzf "$archive" gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan the working files and git history for secrets
        run: |
          gitleaks dir . --no-banner --redact
          gitleaks git . --no-banner --redact

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install dependencies
        run: |
          npm ci
          uv sync

      - name: Run every check
        run: npm run check

      # The snapshot folders carry any missing Linux baselines that Playwright wrote.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/**/*-snapshots/
          if-no-files-found: ignore
          retention-days: 14

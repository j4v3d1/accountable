<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accountable</title>
    <script>
      // Apply the saved mode before anything is drawn, so a dark page never flashes light
      // (concern 14). lib/theme.ts reads and saves the same key.
      try {
        if (localStorage.getItem("accountable-theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch {
        // Storage can't be read: stay light.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

[project]
name = "accountable"
version = "0.1.0"
description = "Accountable, a real estate sales CRM"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165.0",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "ty>=0.0.109",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
filterwarnings = [
    # Starlette suggests a successor package to httpx for its TestClient; httpx stays until that is vetted.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 120
src = ["backend", "backend/tests"]

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ty.environment]
extra-paths = ["backend"]

[tool.coverage.run]
source = ["backend/app"]

[tool.coverage.report]
fail_under = 80
